0 608 L1152 625 L1130 642" stroke="#8EA2EE" stroke-width="5" fill="none"/><rect x="1180" y="590" width="620" height="70" rx="14" fill="none" stroke="#3FBF8F" stroke-width="3"/><text x="1206" y="637" font-family="Inter, Helvetica Neue, DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">cube → left, rest → right</text><rect x="120" y="720" width="900" height="70" rx="14" fill="#1E2F78" stroke="#B8C5F6" stroke-width="3"/><text x="146" y="767" font-family="Inter, Helvetica Neue, DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">“same as usual, but swap blue and yellow”</text><path d="M1050 755 L1150 755 M1130 738 L1152 755 L1130 772" stroke="#8EA2EE" stroke-width="5" fill="none"/><rect x="1180" y="720" width="620" height="70" rx="14" fill="none" stroke="#3FBF8F" stroke-width="3"/><text x="1206" y="767" font-family="Inter, Helvetica Neue, DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">yellow → right, blue → centre</text><text x="120" y="930" font-family="Inter, Helvetica Neue, DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#E4EAFD" text-anchor="start" letter-spacing="0">No templates. 8 training templates × 36 permutations, 200 sampled and 26 unseen phrasings in the tests.</text></svg>